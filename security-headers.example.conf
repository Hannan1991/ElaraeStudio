# Requires an edge proxy or a host supporting response headers.
# NOT active on GitHub Pages. Do not add HSTS via an HTML meta tag.
# First verify HTTPS on all covered names. Start with a short max-age.
add_header Strict-Transport-Security "max-age=300" always;
# After monitoring, increase max-age; do not enable includeSubDomains/preload blindly.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Test as report-only before enforcing on the chosen edge host.
add_header Content-Security-Policy-Report-Only "default-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self' https://formspree.io" always;
# Add a verified report-to endpoint before expecting reports to be delivered.
